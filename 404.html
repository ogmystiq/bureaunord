<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sidan finns inte – Northline Studio</title>
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; background: #0a0c10; color: #eef1f4; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .nl-screen { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px 20px; text-align: center; box-sizing: border-box; background: radial-gradient(60% 45% at 80% 0%, rgba(57, 209, 180, 0.16), transparent 70%), radial-gradient(50% 40% at 10% 100%, rgba(111, 124, 255, 0.14), transparent 70%), #0a0c10; }
    .nl-mark { width: 64px; height: 64px; }
    .nl-loading .nl-mark { animation: nl-pulse 1.6s ease-in-out infinite; }
    @keyframes nl-pulse { 50% { opacity: 0.45; transform: scale(0.96); } }
    .nl-loading p { margin: 0; font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; color: #98a2ad; }
    .nl-bar { width: 140px; height: 2px; border-radius: 2px; background: rgba(238, 241, 244, 0.1); overflow: hidden; }
    .nl-bar::after { content: ""; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #39d1b4, #6f7cff); animation: nl-slide 1.2s ease-in-out infinite; }
    @keyframes nl-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    .nl-404 h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 8vw, 3.6rem); letter-spacing: -0.02em; line-height: 1.05; }
    .nl-404 p { margin: 0; max-width: 26rem; color: #98a2ad; line-height: 1.6; }
    .nl-404 a.nl-btn { display: inline-flex; align-items: center; min-height: 50px; padding: 0 26px; border-radius: 999px; background: #d9e4ec; color: #0a0c10; font-weight: 600; text-decoration: none; }
    .nl-404 a.nl-btn:hover { background: #fff; }
    .nl-code { font-size: 0.75rem; letter-spacing: 0.2em; color: #39d1b4; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .nl-loading .nl-mark, .nl-bar::after { animation: none; } }
  </style>
</head>
<body>
  <!-- Laddning (visas bara för skiss-länkar) -->
  <div class="nl-screen nl-loading" id="nl-loading" hidden role="status" aria-live="polite">
    <svg class="nl-mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#39d1b4"/><stop offset="1" stop-color="#6f7cff"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="none" stroke="url(#g1)" stroke-width="2"/><path d="M2 43 H18.5 M45.5 43 H62" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/><path d="M22.5 43 V21 L41.5 43 V21" fill="none" stroke="#eef1f4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>Förbereder er skiss</p>
    <div class="nl-bar" aria-hidden="true"></div>
  </div>

  <!-- Vanlig 404 -->
  <main class="nl-screen nl-404" id="nl-404" hidden>
    <svg class="nl-mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#39d1b4"/><stop offset="1" stop-color="#6f7cff"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="none" stroke="url(#g2)" stroke-width="2"/><path d="M2 43 H18.5 M45.5 43 H62" stroke="url(#g2)" stroke-width="2" stroke-linecap="round"/><path d="M22.5 43 V21 L41.5 43 V21" fill="none" stroke="#eef1f4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="nl-code">404</span>
    <h1>Sidan finns inte</h1>
    <p>Länken kan vara felskriven eller så har sidan flyttats.</p>
    <a class="nl-btn" href="/">Till startsidan</a>
  </main>

  <noscript><style>#nl-404 { display: flex !important; }</style></noscript>

  <script>
  /* Northline Studio – 404 och korta skiss-länkar.
     /skiss/<slug> hämtar salongens uppgifter från n8n och visar skissen på
     samma adress med skiss-sidans egen HTML, CSS och JS (en enda design).
     Namn och stad sätts in med textContent av skiss/script.js. */
  (function () {
    var WEBHOOK = "https://mystiq.app.n8n.cloud/webhook/skiss?slug=";
    var match = window.location.pathname.match(/^\/skiss\/([A-Za-z0-9-]{1,80})\/?$/);
    if (!match) { document.getElementById("nl-404").hidden = false; return; }

    var slug = match[1].toLowerCase();
    var loading = document.getElementById("nl-loading");
    loading.hidden = false;

    function withTimeout(promise, ms) {
      return Promise.race([promise, new Promise(function (_, reject) { setTimeout(function () { reject(new Error("timeout")); }, ms); })]);
    }
    function str(v) { return typeof v === "string" ? v : ""; }

    var lookup = withTimeout(
      fetch(WEBHOOK + encodeURIComponent(slug), { headers: { Accept: "application/json" }, credentials: "omit", referrerPolicy: "no-referrer" })
        .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); }),
      7000
    ).then(function (d) {
      if (d && d.hittad === true) return { namn: str(d.namn), stad: str(d.stad), typ: str(d.typ), adress: str(d.adress), telefon: str(d.telefon) };
      return null;
    }).catch(function () { return null; });

    var template = fetch("/skiss/index.html", { credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error("mall " + r.status); return r.text(); });

    Promise.all([lookup, template]).then(function (res) {
      // Hittades inte eller fel: "Er salong" med ljus stil
      window.SKISS_DATA = res[0] || { namn: "", stad: "", typ: "", adress: "", telefon: "" };
      var doc = new DOMParser().parseFromString(res[1], "text/html");

      // Gör skiss-sidans relativa adresser (style.css, script.js) absoluta
      var base = document.createElement("base");
      base.href = "/skiss/";
      var scripts = [];
      var head = document.head;
      while (head.firstChild) head.removeChild(head.firstChild);
      head.appendChild(base);
      Array.prototype.forEach.call(doc.head.childNodes, function (n) {
        head.appendChild(document.importNode(n, true));
      });
      document.body.className = doc.body.className;
      document.body.innerHTML = "";
      Array.prototype.forEach.call(doc.body.childNodes, function (n) {
        if (n.nodeName === "SCRIPT") { scripts.push(n.getAttribute("src")); return; }
        document.body.appendChild(document.importNode(n, true));
      });
      // Länkar som börjar med # ska stanna på samma sida trots <base>
      document.querySelectorAll('a[href^="#"]').forEach(function (a) {
        a.setAttribute("href", window.location.pathname + a.getAttribute("href"));
      });
      scripts.forEach(function (src) {
        if (!src) return;
        var s = document.createElement("script");
        s.src = src;
        document.body.appendChild(s);
      });
    }).catch(function () {
      // Mallen gick inte att hämta: visa vanlig 404 i stället för en tom sida
      loading.hidden = true;
      document.getElementById("nl-404").hidden = false;
    });
  })();
  </script>
</body>
</html>
